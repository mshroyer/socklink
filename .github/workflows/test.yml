name: Test
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  test:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: Homebrew/actions/setup-homebrew@main
        if: ${{ contains(inputs.os, 'macos-') }}

      - name: Install tmux
        run: brew install tmux
        if: ${{ contains(inputs.os, 'macos-') }}

      - name: Install zsh
        run: sudo apt install --no-install-recommends zsh
        if: ${{ contains(inputs.os, 'ubuntu-') }}

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Run tests
        run: scripts/test.sh
