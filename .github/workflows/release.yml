name: release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches-ignore:
      - "**"

permissions:
  actions: read
  contents: write

jobs:
  lint_release:
    runs-on: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Lint release
        run: python3 scripts/release.py lint

  await_ci:
    runs-on: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Wait for successful CI run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py wait-ci ${{ github.sha }}

  # Run the tests that don't already run on push, now that await_ci has
  # checked the push-based ones.
  test_all:
    needs: [lint_release, await_ci]
    uses: ./.github/workflows/test-all.yml
    permissions:
      actions: write
      contents: read
    with:
      skip-push-tests: true

  create_release:
    runs-on: ubuntu-26.04-arm
    needs: [lint_release, test_all]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py create

  upload_script:
    runs-on: ubuntu-26.04-arm
    needs: create_release

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py upload socklink.sh
