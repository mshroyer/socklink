name: test-all
on:
  workflow_dispatch:
    inputs:
      skip-push-tests:
        description: "Skip test workflows that already run on push"
        type: boolean
        default: false
  workflow_call:
    inputs:
      skip-push-tests:
        type: boolean
        default: false
  schedule:
    - cron: "57 12 * * 1"

permissions:
  actions: write
  contents: read

# Runs all the test workflows, failing if any of them fail.
#
# The tests are dispatched as their own workflow runs (rather than invoked via
# workflow_call) so that each one's run history and README status badge stay
# up to date.  Each job here dispatches one test workflow and waits for it to
# finish.
jobs:
  list:
    runs-on: ubuntu-26.04-arm
    outputs:
      workflows: ${{ steps.list.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7

      - name: List test workflows
        id: list
        env:
          SKIP_PUSH_TESTS: ${{ inputs.skip-push-tests || false }}
        run: |
          set -euo pipefail

          workflows=()
          for f in .github/workflows/test-*.yml; do
            name=$(basename "$f")
            if [ "$name" = test-all.yml ]; then
              continue
            fi
            if [ "$SKIP_PUSH_TESTS" = true ] && grep -q '^  push:' "$f"; then
              echo "Skipping $name, which runs on push"
              continue
            fi
            workflows+=("$name")
          done

          json=$(printf '"%s",' "${workflows[@]}")
          echo "workflows=[${json%,}]" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: list
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        workflow: ${{ fromJSON(needs.list.outputs.workflows) }}
    name: ${{ matrix.workflow }}
    steps:
      - name: Run ${{ matrix.workflow }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ matrix.workflow }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          out=$(gh workflow run "$WORKFLOW" --ref "$REF")
          echo "$out"
          run_id=$(grep -oE '/actions/runs/[0-9]+' <<< "$out" | grep -oE '[0-9]+$') || {
            echo "Couldn't find the dispatched run's ID" >&2
            exit 1
          }

          # Poll slowly, since all the jobs here share GITHUB_TOKEN's API rate
          # limit.
          status=0
          gh run watch "$run_id" --interval 60 --exit-status > /dev/null || status=$?
          gh run view "$run_id"
          exit "$status"
